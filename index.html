<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PowerCalc Pro - Clean Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=Noto+Sans+Thai:wght@400;500;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'Noto Sans Thai', 'sans-serif'],
                        mono: ['Orbitron', 'monospace']
                    },
                    colors: {
                        cyber: {
                            purple: '#a855f7', // W
                            orange: '#f97316', // P
                            blue: '#0ea5e9',   // t
                            green: '#22c55e',  // Money
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #f8fafc;
            /* Light mesh background */
            background-image: 
                linear-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
        }

        /* Clean Glass Panels */
        .cyber-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .cyber-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        /* Soft Glow Effects for Light Mode */
        .shadow-glow-purple { box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.4); }
        .shadow-glow-orange { box-shadow: 0 4px 15px rgba(249, 115, 22, 0.2); border-color: rgba(249, 115, 22, 0.4); }
        .shadow-glow-blue { box-shadow: 0 4px 15px rgba(14, 165, 233, 0.2); border-color: rgba(14, 165, 233, 0.4); }

        /* Input Styles */
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .cyber-input {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .cyber-input:focus {
            background: #ffffff;
            outline: none;
        }
        
        /* Custom Scrollbar Light */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-24 overflow-x-hidden">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FeatherIcon = ({ name, className, style }) => {
            const svgStr = window.feather && window.feather.icons[name] 
                ? window.feather.icons[name].toSvg({ class: className }) 
                : '';
            return <span style={{ display: 'contents', ...style }} dangerouslySetInnerHTML={{ __html: svgStr }} />;
        };

        const TransformerTriangle = ({ mode, setMode, val1, val2, onDragValue }) => {
            const [hovered, setHovered] = useState(null);
            const [interaction, setInteraction] = useState({
                active: false, isDragging: false, piece: null, startX: 0, startY: 0, initialVal: 0
            });

            const handlePointerDown = (e, piece) => {
                e.target.setPointerCapture(e.pointerId);
                let currentVal = 0;
                if (mode === 'findW') { currentVal = piece === 'findP' ? val1 : piece === 'findT' ? val2 : 0; }
                else if (mode === 'findP') { currentVal = piece === 'findW' ? val1 : piece === 'findT' ? val2 : 0; }
                else if (mode === 'findT') { currentVal = piece === 'findW' ? val1 : piece === 'findP' ? val2 : 0; }
                
                setInteraction({ active: true, isDragging: false, piece: piece, startX: e.clientX, startY: e.clientY, initialVal: Number(currentVal) || 0 });
            };

            const handlePointerMove = (e) => {
                if (!interaction.active) return;
                const deltaY = interaction.startY - e.clientY;
                const deltaX = Math.abs(interaction.startX - e.clientX);
                
                if (!interaction.isDragging && (Math.abs(deltaY) > 5 || deltaX > 5)) {
                    setInteraction(prev => ({ ...prev, isDragging: true }));
                }

                if (interaction.isDragging) {
                    if (interaction.piece === mode) return; 
                    const multiplier = interaction.piece === 'findT' ? 0.5 : 5;
                    let newVal = Math.max(0, interaction.initialVal + (deltaY * multiplier));
                    newVal = interaction.piece === 'findT' ? Math.round(newVal * 10) / 10 : Math.round(newVal);
                    onDragValue(interaction.piece, newVal);
                }
            };

            const handlePointerUp = (e, piece) => {
                if (!interaction.active) return;
                e.target.releasePointerCapture(e.pointerId);
                if (!interaction.isDragging) setMode(piece);
                setInteraction({ active: false, isDragging: false, piece: null, startX: 0, startY: 0, initialVal: 0 });
            };

            const getTransform = (piece) => {
                const isSelected = mode === piece;
                const isHovered = hovered === piece;
                const isBeingDragged = interaction.isDragging && interaction.piece === piece;
                
                let baseTx = 0, baseTy = 0, scale = 1;

                if (isSelected) {
                    scale = 1.15;
                    if (piece === 'findW') { baseTy = -40; }
                    if (piece === 'findP') { baseTx = -40; baseTy = 30; }
                    if (piece === 'findT') { baseTx = 40; baseTy = 30; }
                } else {
                    scale = 0.9;
                    if (piece === 'findW') { baseTy = 15; }
                    if (piece === 'findP') { baseTx = 15; baseTy = -10; }
                    if (piece === 'findT') { baseTx = -15; baseTy = -10; }
                }

                if (isBeingDragged) scale = 1.1; 
                else if (isHovered && !isSelected) {
                    scale = 0.95;
                    if (piece === 'findW') { baseTy -= 10; }
                    if (piece === 'findP') { baseTx -= 10; baseTy += 10; }
                    if (piece === 'findT') { baseTx += 10; baseTy += 10; }
                }

                return `translate(${baseTx}px, ${baseTy}px) scale(${scale})`;
            };

            const getOpacity = (piece) => (mode === piece ? 1 : (interaction.isDragging && interaction.piece !== piece ? 0.3 : 0.6));
            const getCursor = (piece) => {
                if (mode === piece) return 'cursor-default';
                return interaction.isDragging && interaction.piece === piece ? 'cursor-grabbing' : 'cursor-grab';
            };

            return (
                <div className="w-full h-80 flex items-center justify-center relative select-none">
                    {/* Soft Core Background for Light Mode */}
                    <div className={`absolute w-40 h-40 rounded-full blur-[50px] opacity-20 transition-colors duration-700
                        ${mode === 'findW' ? 'bg-purple-500' : mode === 'findP' ? 'bg-orange-500' : 'bg-blue-500'}`}>
                    </div>

                    <div className="w-72 h-72 relative z-10">
                        <svg viewBox="-20 -20 240 240" className="w-full h-full overflow-visible drop-shadow-xl">
                            <defs>
                                <filter id="shadow-w"><feDropShadow dx="0" dy="8" stdDeviation="6" floodColor="#a855f7" floodOpacity="0.3"/></filter>
                                <filter id="shadow-p"><feDropShadow dx="0" dy="8" stdDeviation="6" floodColor="#f97316" floodOpacity="0.3"/></filter>
                                <filter id="shadow-t"><feDropShadow dx="0" dy="8" stdDeviation="6" floodColor="#0ea5e9" floodOpacity="0.3"/></filter>
                            </defs>

                            {/* W Section */}
                            <g 
                                onPointerDown={(e) => handlePointerDown(e, 'findW')} onPointerMove={handlePointerMove} onPointerUp={(e) => handlePointerUp(e, 'findW')} onPointerCancel={(e) => handlePointerUp(e, 'findW')} onMouseEnter={() => setHovered('findW')} onMouseLeave={() => setHovered(null)}
                                className={`touch-none ${getCursor('findW')}`}
                                style={{ transform: getTransform('findW'), transformOrigin: '100px 60px', opacity: getOpacity('findW'), transition: interaction.isDragging ? 'none' : 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)' }}
                            >
                                <path d="M100 10 L145 82 L55 82 Z" fill="#faf5ff" stroke="#a855f7" strokeWidth="3" filter={mode === 'findW' ? "url(#shadow-w)" : ""} />
                                <text x="100" y="65" textAnchor="middle" fill="#a855f7" fontSize="28" fontWeight="900" style={{ pointerEvents: 'none' }}>W</text>
                            </g>
                            
                            {/* P Section */}
                            <g 
                                onPointerDown={(e) => handlePointerDown(e, 'findP')} onPointerMove={handlePointerMove} onPointerUp={(e) => handlePointerUp(e, 'findP')} onPointerCancel={(e) => handlePointerUp(e, 'findP')} onMouseEnter={() => setHovered('findP')} onMouseLeave={() => setHovered(null)}
                                className={`touch-none ${getCursor('findP')}`}
                                style={{ transform: getTransform('findP'), transformOrigin: '70px 130px', opacity: getOpacity('findP'), transition: interaction.isDragging ? 'none' : 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)' }}
                            >
                                <path d="M52 88 L98 88 L98 168 L8 168 Z" fill="#fff7ed" stroke="#f97316" strokeWidth="3" filter={mode === 'findP' ? "url(#shadow-p)" : ""} />
                                <text x="55" y="140" textAnchor="middle" fill="#f97316" fontSize="28" fontWeight="900" style={{ pointerEvents: 'none' }}>P</text>
                            </g>

                            {/* t Section */}
                            <g 
                                onPointerDown={(e) => handlePointerDown(e, 'findT')} onPointerMove={handlePointerMove} onPointerUp={(e) => handlePointerUp(e, 'findT')} onPointerCancel={(e) => handlePointerUp(e, 'findT')} onMouseEnter={() => setHovered('findT')} onMouseLeave={() => setHovered(null)}
                                className={`touch-none ${getCursor('findT')}`}
                                style={{ transform: getTransform('findT'), transformOrigin: '130px 130px', opacity: getOpacity('findT'), transition: interaction.isDragging ? 'none' : 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)' }}
                            >
                                <path d="M102 88 L148 88 L192 168 L102 168 Z" fill="#f0f9ff" stroke="#0ea5e9" strokeWidth="3" filter={mode === 'findT' ? "url(#shadow-t)" : ""} />
                                <text x="145" y="140" textAnchor="middle" fill="#0ea5e9" fontSize="28" fontWeight="900" style={{ pointerEvents: 'none' }}>t</text>
                            </g>
                        </svg>
                    </div>
                    
                    {interaction.isDragging && (
                        <div className="absolute bottom-0 text-center w-full animate-pulse text-slate-400 text-xs font-bold tracking-widest uppercase">
                            กำลังปรับค่า...
                        </div>
                    )}
                </div>
            );
        };

        const CyberInput = ({ label, unit, value, onChange, color, icon }) => {
            const containerRef = useRef(null);
            const [interaction, setInteraction] = useState({ active: false, startX: 0, startOffset: 0, initialVal: 0 });
            const [dragOffset, setDragOffset] = useState(0);

            const handlePointerDown = (e) => {
                e.target.setPointerCapture(e.pointerId);
                setInteraction({ active: true, startX: e.clientX, startOffset: dragOffset, initialVal: Number(value) || 0 });
            };

            const handlePointerMove = (e) => {
                if (!interaction.active) return;
                const deltaX = e.clientX - interaction.startX;
                const multiplier = icon === 't' ? 0.5 : 5;
                let newVal = Math.max(0, interaction.initialVal + (deltaX * multiplier));
                newVal = icon === 't' ? Math.round(newVal * 10) / 10 : Math.round(newVal);
                onChange(newVal);

                if (containerRef.current) {
                    const maxRight = containerRef.current.offsetWidth - 56;
                    const newOffset = interaction.startOffset + deltaX;
                    const clampedOffset = Math.max(0, Math.min(newOffset, maxRight));
                    setDragOffset(clampedOffset);
                }
            };

            const handlePointerUp = (e) => {
                if (!interaction.active) return;
                e.target.releasePointerCapture(e.pointerId);
                setInteraction({ active: false, startX: 0, startOffset: 0, initialVal: 0 });
            };

            const colorMap = {
                purple: 'focus:border-purple-400 shadow-glow-purple text-purple-700',
                orange: 'focus:border-orange-400 shadow-glow-orange text-orange-700',
                blue: 'focus:border-blue-400 shadow-glow-blue text-blue-700'
            };
            const iconBg = {
                purple: 'bg-purple-100 text-purple-600 border-purple-200 hover:bg-purple-200',
                orange: 'bg-orange-100 text-orange-600 border-orange-200 hover:bg-orange-200',
                blue: 'bg-blue-100 text-blue-600 border-blue-200 hover:bg-blue-200'
            };

            return (
                <div className="mb-4">
                    <label className="block text-[11px] sm:text-xs font-bold text-slate-500 mb-2 ml-1 uppercase tracking-[0.1em]">{label}</label>
                    <div className="relative group" ref={containerRef}>
                        <div 
                            onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp}
                            className={`absolute inset-y-1 left-1 w-10 flex items-center justify-center rounded-lg border ${iconBg[color]} font-black z-20 touch-none cursor-ew-resize`}
                            style={{ 
                                transform: `translateX(${dragOffset}px)`,
                                transition: interaction.active ? 'background-color 0.2s' : 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s'
                            }}
                        >
                            {icon}
                            {interaction.active && (
                                <div className="absolute -top-8 bg-slate-800 text-white text-[10px] px-2 py-1 rounded-md shadow-lg flex items-center whitespace-nowrap pointer-events-none">
                                    <svg className="w-3 h-3 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                        <polyline points="5 9 2 12 5 15"></polyline><polyline points="19 9 22 12 19 15"></polyline><line x1="2" y1="12" x2="22" y2="12"></line>
                                    </svg>
                                    ลากซ้ายขวา
                                </div>
                            )}
                        </div>
                        <input 
                            type="number" value={value} onChange={(e) => onChange(e.target.value)} 
                            className={`w-full cyber-input pl-14 pr-24 py-3 rounded-xl text-right font-black text-xl sm:text-2xl font-mono ${value ? colorMap[color] : 'focus:border-slate-300'}`} 
                            placeholder="0" 
                        />
                        <div className="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <span className="text-slate-400 font-bold uppercase text-xs sm:text-sm bg-slate-100 px-2 py-1 rounded-md">{unit}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const ElectricalDashboard = () => {
            const [calcMode, setCalcMode] = useState('findW'); 
            const [val1, setVal1] = useState('');
            const [val2, setVal2] = useState('');
            const [result, setResult] = useState(null);

            const [appliances, setAppliances] = useState([
                { id: 1, name: 'Air Conditioner', watts: 1200, hours: 8, quantity: 1 },
                { id: 2, name: 'Refrigerator', watts: 150, hours: 24, quantity: 1 },
            ]);
            const [newItem, setNewItem] = useState({ name: '', watts: '', hours: '', quantity: 1 });
            const [billMode, setBillMode] = useState('progressive'); 
            const [unitPrice, setUnitPrice] = useState(4.5); 
            const [ftRate, setFtRate] = useState(0.3972); 

            const getApplianceIcon = (name) => {
                const n = name.toLowerCase();
                if (n.includes('แอร์') || n.includes('air') || n.includes('ปรับอากาศ')) return 'wind';
                if (n.includes('เย็น') || n.includes('fridge')) return 'box';
                if (n.includes('ทีวี') || n.includes('tv') || n.includes('ทัศน์')) return 'tv';
                if (n.includes('ไฟ') || n.includes('light')) return 'sun';
                if (n.includes('พัดลม') || n.includes('fan')) return 'aperture';
                if (n.includes('คอม') || n.includes('pc') || n.includes('แล็ปท็อป')) return 'monitor';
                return 'cpu'; 
            };

            const calculatePhysics = () => {
                const v1 = parseFloat(val1); const v2 = parseFloat(val2);
                if (isNaN(v1) || isNaN(v2) || val1 === '' || val2 === '') { setResult(null); return; }
                let res = 0;
                if (calcMode === 'findW') res = v1 * v2;      
                else if (calcMode === 'findP') res = v1 / v2; 
                else if (calcMode === 'findT') res = v1 / v2; 
                setResult(res);
            };

            useEffect(() => { calculatePhysics(); }, [val1, val2, calcMode]);
            
            const handleDragValue = (piece, newVal) => {
                if (calcMode === 'findW') { if (piece === 'findP') setVal1(newVal); if (piece === 'findT') setVal2(newVal); }
                else if (calcMode === 'findP') { if (piece === 'findW') setVal1(newVal); if (piece === 'findT') setVal2(newVal); }
                else if (calcMode === 'findT') { if (piece === 'findW') setVal1(newVal); if (piece === 'findP') setVal2(newVal); }
            };

            const addAppliance = (e) => {
                e.preventDefault();
                if (!newItem.name || !newItem.watts || !newItem.hours) return;
                setAppliances([...appliances, { ...newItem, id: Date.now() }]);
                setNewItem({ name: '', watts: '', hours: '', quantity: 1 });
            };
            const removeAppliance = (id) => setAppliances(appliances.filter(app => app.id !== id));

            const totalDailyUnits = appliances.reduce((sum, item) => sum + ((item.watts / 1000) * item.hours * item.quantity), 0);
            const totalMonthlyUnits = totalDailyUnits * 30;

            const calculateProgressiveBill = (units) => {
                let energyCharge = 0, serviceCharge = 0, rateType = '';
                if (units <= 150) {
                    rateType = 'TYPE 1.1 (≤150U)'; serviceCharge = 8.19;
                    const step1 = Math.min(units, 15); energyCharge += step1 * 2.3488; let remaining = units - step1;
                    if (remaining > 0) { const step2 = Math.min(remaining, 10); energyCharge += step2 * 2.9882; remaining -= step2; }
                    if (remaining > 0) { const step3 = Math.min(remaining, 10); energyCharge += step3 * 3.2405; remaining -= step3; }
                    if (remaining > 0) { const step4 = Math.min(remaining, 65); energyCharge += step4 * 3.6237; remaining -= step4; }
                    if (remaining > 0) { const step5 = Math.min(remaining, 50); energyCharge += step5 * 3.7171; remaining -= step5; }
                    if (remaining > 0) { const step6 = Math.min(remaining, 250); energyCharge += step6 * 4.2218; remaining -= step6; }
                    if (remaining > 0) { energyCharge += remaining * 4.4217; }
                } else {
                    rateType = 'TYPE 1.2 (>150U)'; serviceCharge = 24.62;
                    const step1 = 150; energyCharge += step1 * 3.2484; let remaining = units - step1;
                    if (remaining > 0) { const step2 = Math.min(remaining, 250); energyCharge += step2 * 4.2218; remaining -= step2; }
                    if (remaining > 0) { energyCharge += remaining * 4.4217; }
                }
                const ftCharge = units * ftRate;
                const totalBeforeVat = energyCharge + serviceCharge + ftCharge;
                const vat = totalBeforeVat * 0.07;
                return { energyCharge, serviceCharge, ftCharge, vat, grandTotal: totalBeforeVat + vat, rateType };
            };

            let monthlyBillData = billMode === 'progressive' 
                ? calculateProgressiveBill(totalMonthlyUnits) 
                : { grandTotal: totalMonthlyUnits * unitPrice, energyCharge: totalMonthlyUnits * unitPrice, serviceCharge: 0, ftCharge: 0, vat: 0, rateType: 'CUSTOM FIXED' };

            const totalYearlyCost = monthlyBillData.grandTotal * 12;

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    
                    {/* Light Unified Header */}
                    <header className="cyber-header sticky top-0 z-50 py-3 px-4 sm:px-8 lg:px-12 flex flex-col md:flex-row items-center justify-between gap-3">
                        <div className="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-blue-500 flex items-center justify-center shadow-md shrink-0">
                                <FeatherIcon name="cpu" className="text-white w-5 h-5" />
                            </div>
                            <h1 className="text-xl font-black text-slate-800 tracking-widest uppercase">Power<span className="text-blue-500">Calc</span></h1>
                        </div>

                        <div className="flex flex-wrap items-center justify-center gap-2 sm:gap-3 bg-slate-100 p-1.5 px-2 rounded-xl border border-slate-200 w-full md:w-auto">
                            <div className="flex gap-1 bg-white rounded-lg p-1 shadow-sm">
                                <button onClick={() => setBillMode('progressive')} className={`px-3 py-1.5 sm:px-4 sm:py-1.5 rounded-md text-[10px] sm:text-xs font-bold uppercase tracking-wider transition-all duration-300 ${billMode === 'progressive' ? 'bg-indigo-50 text-indigo-600 shadow-sm' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    กฟน.
                                </button>
                                <button onClick={() => setBillMode('simple')} className={`px-3 py-1.5 sm:px-4 sm:py-1.5 rounded-md text-[10px] sm:text-xs font-bold uppercase tracking-wider transition-all duration-300 ${billMode === 'simple' ? 'bg-orange-50 text-orange-600 shadow-sm' : 'text-slate-500 hover:bg-slate-50'}`}>
                                    กำหนดเอง
                                </button>
                            </div>

                            <div className="h-6 w-px bg-slate-300 mx-1 hidden sm:block"></div>

                            {billMode === 'simple' ? (
                                <div className="flex items-center gap-1 sm:gap-2 px-2">
                                    <span className="text-[10px] sm:text-xs font-bold text-slate-500 uppercase">Rate:</span>
                                    <input type="number" value={unitPrice} onChange={(e) => setUnitPrice(Number(e.target.value))} className="w-12 sm:w-16 font-black text-slate-800 bg-transparent border-b border-slate-300 focus:border-orange-500 outline-none text-center text-sm" />
                                    <span className="text-[10px] sm:text-xs font-bold text-slate-500">฿/U</span>
                                </div>
                            ) : (
                                <div className="flex items-center gap-1 sm:gap-2 px-2">
                                    <span className="text-[10px] sm:text-xs font-bold text-slate-500 uppercase">Ft:</span>
                                    <input type="number" value={ftRate} onChange={(e) => setFtRate(Number(e.target.value))} step="0.0001" className="w-16 sm:w-20 font-black text-slate-800 bg-transparent border-b border-slate-300 focus:border-indigo-500 outline-none text-center text-sm" />
                                    <span className="text-[10px] sm:text-xs font-bold text-slate-500">฿/U</span>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="flex-grow w-full max-w-[1600px] mx-auto px-4 sm:px-8 lg:px-12 py-6 sm:py-10 space-y-12">

                        {/* SECTION 1: Physics Drag & Drop Matrix */}
                        <section>
                            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 sm:mb-6 gap-2">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded bg-white shadow-sm border border-slate-200 flex items-center justify-center shrink-0"><FeatherIcon name="hexagon" className="text-purple-500 w-4 h-4" /></div>
                                    <h2 className="text-xl font-black text-slate-800 tracking-widest uppercase">Physics Matrix <span className="text-slate-400 font-medium text-sm">W=Pt</span></h2>
                                </div>
                                <div className="text-xs font-bold text-slate-500 bg-white shadow-sm px-3 py-1.5 rounded-full border border-slate-200 flex items-center gap-2">
                                    <FeatherIcon name="move" className="w-3 h-3 text-purple-500" /> ลากชิ้นส่วนขึ้น/ลง เพื่อปรับค่า
                                </div>
                            </div>
                            
                            <div className="grid lg:grid-cols-2 gap-6 sm:gap-8">
                                {/* LEFT: Interactive Drag Transformer */}
                                <div className="cyber-panel p-4 sm:p-8 flex flex-col items-center justify-center relative overflow-hidden group min-h-[350px]">
                                    <TransformerTriangle mode={calcMode} setMode={setCalcMode} val1={val1} val2={val2} onDragValue={handleDragValue} />
                                    
                                    <div className="mt-4 text-center z-10 w-full max-w-xs mx-auto">
                                        <div className="bg-white border border-slate-200 rounded-xl p-3 sm:p-4 flex items-center justify-between shadow-sm">
                                            <div className="text-left">
                                                <div className="text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-bold">Active Formula</div>
                                                <div className="text-base sm:text-lg font-black text-slate-800 font-mono">
                                                    {calcMode === 'findW' && <><span className="text-purple-600">W</span> = P × t</>}
                                                    {calcMode === 'findP' && <><span className="text-orange-600">P</span> = W ÷ t</>}
                                                    {calcMode === 'findT' && <><span className="text-blue-600">t</span> = W ÷ P</>}
                                                </div>
                                            </div>
                                            <FeatherIcon name="activity" className={`w-5 h-5 sm:w-6 sm:h-6 ${calcMode==='findW'?'text-purple-500':calcMode==='findP'?'text-orange-500':'text-blue-500'}`} />
                                        </div>
                                    </div>
                                </div>

                                {/* RIGHT: HUD Inputs & Screen */}
                                <div className="cyber-panel p-4 sm:p-8 flex flex-col justify-between relative overflow-hidden">
                                    <div className="space-y-4 relative z-10">
                                        {calcMode === 'findW' && (
                                            <>
                                                <CyberInput label="Power (P)" unit="Watt" value={val1} onChange={setVal1} color="orange" icon="P"/>
                                                <div className="flex justify-center -my-3 relative z-10"><div className="w-8 h-8 rounded-full bg-slate-50 border border-slate-200 shadow-sm flex items-center justify-center text-slate-400 font-bold text-xl">×</div></div>
                                                <CyberInput label="Time (t)" unit="Sec" value={val2} onChange={setVal2} color="blue" icon="t"/>
                                            </>
                                        )}
                                        {calcMode === 'findP' && (
                                            <>
                                                <CyberInput label="Work/Energy (W)" unit="Joule" value={val1} onChange={setVal1} color="purple" icon="W"/>
                                                <div className="flex justify-center -my-3 relative z-10"><div className="w-8 h-8 rounded-full bg-slate-50 border border-slate-200 shadow-sm flex items-center justify-center text-slate-400 font-bold text-xl">÷</div></div>
                                                <CyberInput label="Time (t)" unit="Sec" value={val2} onChange={setVal2} color="blue" icon="t"/>
                                            </>
                                        )}
                                        {calcMode === 'findT' && (
                                            <>
                                                <CyberInput label="Work/Energy (W)" unit="Joule" value={val1} onChange={setVal1} color="purple" icon="W"/>
                                                <div className="flex justify-center -my-3 relative z-10"><div className="w-8 h-8 rounded-full bg-slate-50 border border-slate-200 shadow-sm flex items-center justify-center text-slate-400 font-bold text-xl">÷</div></div>
                                                <CyberInput label="Power (P)" unit="Watt" value={val2} onChange={setVal2} color="orange" icon="P"/>
                                            </>
                                        )}
                                    </div>

                                    {/* Digital Screen */}
                                    <div className={`mt-6 sm:mt-8 bg-slate-50 border rounded-2xl p-4 sm:p-6 text-center relative overflow-hidden transition-all duration-500
                                        ${result !== null 
                                            ? (calcMode==='findW' ? 'border-purple-200 shadow-inner' 
                                            : calcMode==='findP' ? 'border-orange-200 shadow-inner' 
                                            : 'border-blue-200 shadow-inner') 
                                            : 'border-slate-200 shadow-inner'}`}>
                                        
                                        <span className="text-[10px] font-bold uppercase tracking-[0.2em] block mb-2 text-slate-400">Output Result</span>
                                        <div className="flex items-baseline justify-center gap-2 sm:gap-3 font-mono">
                                            <span className={`text-4xl sm:text-5xl md:text-6xl font-black tracking-tighter
                                                ${result !== null ? (calcMode==='findW'?'text-purple-600':calcMode==='findP'?'text-orange-600':'text-blue-600') : 'text-slate-300'}`}>
                                                {result !== null ? result.toLocaleString(undefined, { maximumFractionDigits: 2 }) : '0.00'}
                                            </span>
                                            <span className="text-xl sm:text-2xl font-bold text-slate-400">
                                                {calcMode === 'findW' ? 'J' : calcMode === 'findP' ? 'W' : 's'}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* SECTION 2: Grid Billing Simulation */}
                        <section>
                            <div className="flex items-center gap-3 mb-4 sm:mb-6">
                                <div className="w-8 h-8 rounded bg-white shadow-sm border border-slate-200 flex items-center justify-center shrink-0"><FeatherIcon name="zap" className="text-green-500 w-4 h-4" /></div>
                                <h2 className="text-xl font-black text-slate-800 tracking-widest uppercase">Grid Simulation <span className="text-slate-400 font-medium text-sm">Billing</span></h2>
                            </div>

                            <div className="grid lg:grid-cols-3 gap-6 sm:gap-8">
                                {/* Form (Card Game Style) */}
                                <div className="lg:col-span-1 perspective-1000">
                                    <div className="relative w-full max-w-sm mx-auto group lg:sticky lg:top-24">
                                        <div className="relative bg-white border border-slate-200 rounded-2xl p-1.5 flex flex-col shadow-xl">
                                            <div className="border border-slate-100 rounded-xl p-4 flex flex-col relative overflow-hidden bg-slate-50">
                                                
                                                <div className="flex justify-between items-center border-b border-slate-200 pb-2 mb-4">
                                                    <div className="flex text-yellow-400 gap-1">
                                                        <FeatherIcon name="star" className="w-3.5 h-3.5 fill-current" />
                                                        <FeatherIcon name="star" className="w-3.5 h-3.5 fill-current" />
                                                        <FeatherIcon name="star" className="w-3.5 h-3.5 fill-current" />
                                                    </div>
                                                    <span className="text-[10px] font-black uppercase tracking-widest text-slate-400">Energy Card</span>
                                                </div>

                                                <form onSubmit={addAppliance} className="flex flex-col relative z-10 space-y-4">
                                                    <div>
                                                        <input type="text" value={newItem.name} onChange={(e) => setNewItem({...newItem, name: e.target.value})} className="w-full bg-white border border-slate-200 rounded-md px-3 py-2 text-sm font-bold text-slate-700 shadow-inner placeholder-slate-400 text-center uppercase tracking-wider focus:border-blue-400 focus:ring-1 focus:ring-blue-400 outline-none transition-colors" placeholder="APPLIANCE NAME" required />
                                                    </div>

                                                    <div className="w-full h-36 bg-white border border-slate-200 rounded-lg flex items-center justify-center relative overflow-hidden shadow-sm">
                                                         <FeatherIcon name={getApplianceIcon(newItem.name)} className="w-16 h-16 text-slate-300 relative z-10 transition-transform duration-500 group-hover:scale-110 group-hover:text-blue-500" />
                                                    </div>

                                                    <div className="grid grid-cols-2 gap-3">
                                                        <div className="bg-white border border-slate-200 rounded-md flex flex-col p-2 relative overflow-hidden focus-within:border-orange-400 shadow-sm transition-all">
                                                            <div className="absolute top-0 left-0 w-1 h-full bg-orange-400"></div>
                                                            <div className="text-[9px] font-black text-orange-500 uppercase tracking-wider mb-1 pl-1">PWR [Watt]</div>
                                                            <input type="number" value={newItem.watts} onChange={(e) => setNewItem({...newItem, watts: e.target.value})} className="w-full bg-transparent text-slate-800 font-mono text-lg font-bold outline-none text-right" placeholder="0" required />
                                                        </div>
                                                        <div className="bg-white border border-slate-200 rounded-md flex flex-col p-2 relative overflow-hidden focus-within:border-blue-400 shadow-sm transition-all">
                                                            <div className="absolute top-0 left-0 w-1 h-full bg-blue-400"></div>
                                                            <div className="text-[9px] font-black text-blue-500 uppercase tracking-wider mb-1 pl-1">TIME [Hrs]</div>
                                                            <input type="number" value={newItem.hours} onChange={(e) => setNewItem({...newItem, hours: e.target.value})} className="w-full bg-transparent text-slate-800 font-mono text-lg font-bold outline-none text-right" placeholder="0" required />
                                                        </div>
                                                    </div>

                                                    <div className="bg-white border border-slate-200 p-2.5 rounded-md text-[10px] text-slate-500 font-mono flex items-center justify-between shadow-sm">
                                                        <span className="uppercase tracking-widest font-bold">Multiplier [Qty]:</span>
                                                        <input type="number" value={newItem.quantity} onChange={(e) => setNewItem({...newItem, quantity: e.target.value})} className="w-16 bg-slate-50 border border-slate-200 rounded px-2 py-1 text-slate-800 font-bold outline-none text-center focus:border-purple-400 transition-colors" min="1" required />
                                                    </div>

                                                    <button type="submit" className="w-full bg-slate-800 hover:bg-slate-900 text-white font-black py-3 rounded-md uppercase tracking-[0.2em] text-xs shadow-md transition-all active:scale-95 mt-2 flex justify-center items-center gap-2">
                                                        <FeatherIcon name="zap" className="w-4 h-4 fill-current text-yellow-400" /> Summon
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Summary & Table */}
                                <div className="lg:col-span-2 flex flex-col gap-6 sm:gap-8">
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6">
                                        <div className="cyber-panel p-4 sm:p-5 relative overflow-hidden group">
                                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Monthly Load</div>
                                            <div className="text-2xl sm:text-3xl font-black text-slate-800 font-mono">{totalMonthlyUnits.toLocaleString(undefined, {maximumFractionDigits:0})} <span className="text-xs sm:text-sm font-normal opacity-50 font-sans">kWh</span></div>
                                            <div className="text-[10px] text-slate-500 mt-2 font-mono">≈ {totalDailyUnits.toFixed(1)} kWh/Day</div>
                                        </div>
                                        <div className="cyber-panel p-4 sm:p-5 relative overflow-hidden border-green-200 shadow-[inset_0_0_20px_rgba(34,197,94,0.05)]">
                                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Est. Bill (Month)</div>
                                            <div className="text-2xl sm:text-3xl font-black text-green-600 font-mono">฿{monthlyBillData.grandTotal.toLocaleString(undefined, {maximumFractionDigits:0})}</div>
                                            <div className="text-[9px] sm:text-[10px] font-bold text-green-600 bg-green-50 border border-green-200 px-2 py-0.5 rounded-full inline-block mt-2 tracking-wider">{monthlyBillData.rateType}</div>
                                        </div>
                                        <div className="cyber-panel p-4 sm:p-5 relative overflow-hidden border-blue-200">
                                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Projection (Year)</div>
                                            <div className="text-2xl sm:text-3xl font-black text-blue-600 font-mono">฿{totalYearlyCost.toLocaleString(undefined, {maximumFractionDigits:0})}</div>
                                            <div className="text-[10px] text-slate-500 mt-2 font-mono">Fixed Estimate x12</div>
                                    </div>
                                </div>

                                {/* Active Appliances Grid */}
                                <div className="cyber-panel overflow-hidden flex-grow flex flex-col p-4 sm:p-5">
                                    <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center justify-between border-b border-slate-100 pb-2">
                                            <div className="flex items-center gap-2">
                                                <FeatherIcon name="layers" className="w-3.5 h-3.5 text-blue-500" />
                                                <span>Active Decks</span>
                                            </div>
                                            <span className="text-blue-600 bg-blue-50 border border-blue-200 px-2 py-0.5 rounded text-[9px] font-bold">{appliances.length} IN PLAY</span>
                                        </div>
                                        
                                        <div className="overflow-y-auto hide-scroll flex-grow pr-1 max-h-[400px]">
                                            {appliances.length === 0 ? (
                                                <div className="h-full min-h-[150px] flex flex-col items-center justify-center text-slate-400 space-y-3">
                                                    <div className="w-16 h-24 border-2 border-dashed border-slate-200 rounded-lg flex items-center justify-center opacity-50 bg-slate-50">
                                                        <FeatherIcon name="plus" className="w-6 h-6 text-slate-300" />
                                                    </div>
                                                    <span className="text-[10px] uppercase tracking-widest font-bold">Awaiting Summon...</span>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-4 pb-2">
                                                    {appliances.map((item) => {
                                                        const monthlyUnits = ((item.watts / 1000) * item.hours * item.quantity) * 30;
                                                        return (
                                                            <div key={item.id} className="relative group">
                                                                <div className="relative bg-white border border-slate-200 group-hover:border-blue-300 rounded-xl p-3 flex flex-col gap-2.5 shadow-sm hover:shadow-md transition-all">
                                                                    
                                                                    <div className="flex justify-between items-start">
                                                                        <div className="flex items-center gap-2">
                                                                            <div className="w-8 h-8 rounded bg-slate-50 border border-slate-200 flex items-center justify-center shrink-0">
                                                                                <FeatherIcon name={getApplianceIcon(item.name)} className="w-4 h-4 text-slate-600" />
                                                                            </div>
                                                                            <div className="flex flex-col">
                                                                                <span className="font-bold text-slate-800 text-xs sm:text-sm truncate max-w-[100px] sm:max-w-[120px]" title={item.name}>{item.name}</span>
                                                                                <span className="text-[8px] sm:text-[9px] text-orange-500 font-bold uppercase tracking-widest flex items-center gap-1 mt-0.5">
                                                                                    <FeatherIcon name="star" className="w-2.5 h-2.5 fill-current" /> Lvl {item.quantity}
                                                                                </span>
                                                                            </div>
                                                                        </div>
                                                                        <button onClick={() => removeAppliance(item.id)} className="text-slate-400 hover:text-red-500 hover:bg-red-50 transition-colors bg-white p-1.5 rounded-md border border-slate-100 hover:border-red-200">
                                                                            <FeatherIcon name="trash-2" className="w-3.5 h-3.5" />
                                                                        </button>
                                                                    </div>
                                                                    
                                                                    <div className="bg-slate-50 rounded-lg p-2 border border-slate-100 relative overflow-hidden shadow-inner">
                                                                         <div className="grid grid-cols-2 gap-2 relative z-10">
                                                                            <div className="flex flex-col items-center justify-center bg-white rounded p-1 border border-slate-200 shadow-sm">
                                                                                <span className="text-[7px] text-orange-500 font-bold uppercase tracking-wider">ATK (PWR)</span>
                                                                                <span className="font-mono text-slate-700 font-bold text-[10px] sm:text-xs">{item.watts}W</span>
                                                                            </div>
                                                                            <div className="flex flex-col items-center justify-center bg-white rounded p-1 border border-slate-200 shadow-sm">
                                                                                <span className="text-[7px] text-blue-500 font-bold uppercase tracking-wider">DEF (TIME)</span>
                                                                                <span className="font-mono text-slate-700 font-bold text-[10px] sm:text-xs">{item.hours}h</span>
                                                                            </div>
                                                                         </div>
                                                                    </div>

                                                                    <div className="flex justify-between items-center bg-white rounded p-1.5 border border-slate-100">
                                                                        <span className="text-[8px] sm:text-[9px] text-slate-500 font-bold uppercase tracking-wider">Monthly Load</span>
                                                                        <div className="flex items-baseline gap-1">
                                                                            <span className="font-mono font-black text-purple-600 text-xs sm:text-sm">{monthlyUnits.toFixed(1)}</span>
                                                                            <span className="text-[7px] sm:text-[8px] text-slate-400 font-bold">kWh</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* Total Bill Receipt */}
                                    {billMode === 'progressive' && totalMonthlyUnits > 0 && (
                                        <div className="bg-white border border-slate-200 shadow-sm rounded-xl p-3 sm:p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 sm:gap-4 relative overflow-hidden">
                                            <div className="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-indigo-400 to-purple-400"></div>
                                            <div className="flex items-start md:items-center gap-3 sm:gap-4 pl-2">
                                                <FeatherIcon name="file-text" className="w-5 h-5 text-indigo-500 shrink-0 mt-1 md:mt-0" />
                                                <div className="font-mono text-[10px] sm:text-xs text-slate-600 space-y-1">
                                                    <div><span className="text-slate-400 font-sans font-bold">BASE:</span> {monthlyBillData.energyCharge.toFixed(2)}</div>
                                                    <div><span className="text-slate-400 font-sans font-bold">SERV:</span> {monthlyBillData.serviceCharge.toFixed(2)} | <span className="text-slate-400 font-sans font-bold">FT:</span> {monthlyBillData.ftCharge.toFixed(2)}</div>
                                                </div>
                                            </div>
                                            <div className="text-left md:text-right border-l-0 md:border-l border-t md:border-t-0 border-slate-100 pl-0 md:pl-4 pt-2 md:pt-0 w-full md:w-auto">
                                                <div className="text-[10px] font-bold text-slate-400 uppercase">+ VAT 7% ({monthlyBillData.vat.toFixed(2)})</div>
                                                <div className="text-base sm:text-lg font-black text-slate-800 tracking-widest font-mono">TOTAL ฿{monthlyBillData.grandTotal.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
                                            </div>
                                        </div>
                                    )}

                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ElectricalDashboard />);
    </script>
</body>
</html>
