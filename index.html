<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerCalc Pro - เครื่องคำนวณพลังงานไฟฟ้า</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles for input type number to hide arrows in some browsers */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 pb-20">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ElectricalDashboard = () => {
            // --- State ส่วนคำนวณสูตร W = Pt ---
            const [calcMode, setCalcMode] = useState('findW'); 
            const [val1, setVal1] = useState('');
            const [val2, setVal2] = useState('');
            const [result, setResult] = useState(null);

            // --- State ส่วนคำนวณค่าไฟบ้าน ---
            const [appliances, setAppliances] = useState([
                { id: 1, name: 'เครื่องปรับอากาศ (12,000 BTU)', watts: 1200, hours: 8, quantity: 1 },
                { id: 2, name: 'ตู้เย็น (7.4 คิว)', watts: 150, hours: 24, quantity: 1 },
                { id: 3, name: 'ทีวี LED 50 นิ้ว', watts: 100, hours: 4, quantity: 1 },
                { id: 4, name: 'หลอดไฟ LED', watts: 10, hours: 6, quantity: 5 },
            ]);
            const [newItem, setNewItem] = useState({ name: '', watts: '', hours: '', quantity: 1 });
            
            // โหมดคำนวณค่าไฟ: 'simple' (คงที่) หรือ 'progressive' (อัตราก้าวหน้า กฟน.)
            const [billMode, setBillMode] = useState('progressive'); 
            const [unitPrice, setUnitPrice] = useState(4.5); // สำหรับโหมด simple
            const [ftRate, setFtRate] = useState(0.3972); // ค่า Ft (บาท/หน่วย)

            // --- Logic คำนวณสูตร W = Pt ---
            const calculatePhysics = () => {
                const v1 = parseFloat(val1);
                const v2 = parseFloat(val2);

                if (isNaN(v1) || isNaN(v2) || val1 === '' || val2 === '') {
                    setResult(null);
                    return;
                }

                let res = 0;
                if (calcMode === 'findW') res = v1 * v2;      
                else if (calcMode === 'findP') res = v1 / v2; 
                else if (calcMode === 'findT') res = v1 / v2; 

                setResult(res);
            };

            useEffect(() => {
                calculatePhysics();
            }, [val1, val2, calcMode]);

            // Request Feather Icons to update after renders
            useEffect(() => {
                if (window.feather) {
                    window.feather.replace();
                }
            });

            const handleModeChange = (mode) => {
                setCalcMode(mode);
                setVal1('');
                setVal2('');
                setResult(null);
            };

            // --- Logic คำนวณค่าไฟบ้าน ---
            const addAppliance = (e) => {
                e.preventDefault();
                if (!newItem.name || !newItem.watts || !newItem.hours) return;
                setAppliances([...appliances, { ...newItem, id: Date.now() }]);
                setNewItem({ name: '', watts: '', hours: '', quantity: 1 });
            };

            const removeAppliance = (id) => {
                setAppliances(appliances.filter(app => app.id !== id));
            };

            // คำนวณหน่วยรวม
            const totalDailyUnits = appliances.reduce((sum, item) => {
                return sum + ((item.watts / 1000) * item.hours * item.quantity);
            }, 0);
            
            const totalMonthlyUnits = totalDailyUnits * 30;

            // --- ฟังก์ชันคำนวณค่าไฟแบบอัตราก้าวหน้า (Progressive Rate) ---
            const calculateProgressiveBill = (units) => {
                let energyCharge = 0;
                let serviceCharge = 0;
                let rateType = '';

                // เกณฑ์: ไม่เกิน 150 หน่วย ใช้ประเภท 1.1, เกิน 150 หน่วย ใช้ประเภท 1.2
                if (units <= 150) {
                    rateType = 'ประเภท 1.1 (ไม่เกิน 150 หน่วย)';
                    serviceCharge = 8.19;
                    
                    // Step 1: 1-15 หน่วย
                    const step1 = Math.min(units, 15);
                    energyCharge += step1 * 2.3488;
                    let remaining = units - step1;

                    // Step 2: 16-25 หน่วย (10 หน่วย)
                    if (remaining > 0) {
                        const step2 = Math.min(remaining, 10);
                        energyCharge += step2 * 2.9882;
                        remaining -= step2;
                    }

                    // Step 3: 26-35 หน่วย (10 หน่วย)
                    if (remaining > 0) {
                        const step3 = Math.min(remaining, 10);
                        energyCharge += step3 * 3.2405;
                        remaining -= step3;
                    }

                    // Step 4: 36-100 หน่วย (65 หน่วย)
                    if (remaining > 0) {
                        const step4 = Math.min(remaining, 65);
                        energyCharge += step4 * 3.6237;
                        remaining -= step4;
                    }

                    // Step 5: 101-150 หน่วย (50 หน่วย)
                    if (remaining > 0) {
                        const step5 = Math.min(remaining, 50);
                        energyCharge += step5 * 3.7171;
                        remaining -= step5;
                    }
                    
                    // Step 6: 151-400 หน่วย (250 หน่วย) - กรณี Edge case 150 พอดี หรือตรรกะต่อเนื่อง
                    if (remaining > 0) {
                        const step6 = Math.min(remaining, 250);
                        energyCharge += step6 * 4.2218;
                        remaining -= step6;
                    }

                    // Step 7: 401+
                    if (remaining > 0) {
                        energyCharge += remaining * 4.4217;
                    }

                } else {
                    rateType = 'ประเภท 1.2 (เกิน 150 หน่วย)';
                    serviceCharge = 24.62;

                    // Step 1: 1-150 หน่วย
                    const step1 = 150; 
                    energyCharge += step1 * 3.2484;
                    let remaining = units - step1;

                    // Step 2: 151-400 หน่วย (250 หน่วย)
                    if (remaining > 0) {
                        const step2 = Math.min(remaining, 250);
                        energyCharge += step2 * 4.2218;
                        remaining -= step2;
                    }

                    // Step 3: เกิน 400 หน่วย
                    if (remaining > 0) {
                        energyCharge += remaining * 4.4217;
                    }
                }

                const ftCharge = units * ftRate;
                const totalBeforeVat = energyCharge + serviceCharge + ftCharge;
                const vat = totalBeforeVat * 0.07;
                const grandTotal = totalBeforeVat + vat;

                return { energyCharge, serviceCharge, ftCharge, vat, grandTotal, rateType };
            };

            // คำนวณยอดเงินตามโหมดที่เลือก
            let monthlyBillData = { grandTotal: 0 };
            
            if (billMode === 'progressive') {
                monthlyBillData = calculateProgressiveBill(totalMonthlyUnits);
            } else {
                // Simple Mode
                const simpleTotal = totalMonthlyUnits * unitPrice;
                monthlyBillData = { 
                    grandTotal: simpleTotal, 
                    energyCharge: simpleTotal, 
                    serviceCharge: 0, 
                    ftCharge: 0, 
                    vat: 0, 
                    rateType: 'กำหนดเอง' 
                };
            }

            const totalYearlyCost = monthlyBillData.grandTotal * 12;

            // --- Helpers for Styling ---
            const getThemeColor = () => {
                switch (calcMode) {
                    case 'findW': return 'text-purple-600 bg-purple-50 border-purple-200 ring-purple-100';
                    case 'findP': return 'text-orange-600 bg-orange-50 border-orange-200 ring-orange-100';
                    case 'findT': return 'text-blue-600 bg-blue-50 border-blue-200 ring-blue-100';
                    default: return 'text-gray-600';
                }
            };

            return (
                <div>
                    {/* Navbar / Header */}
                    <div className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="bg-yellow-400 p-2 rounded-lg shadow-sm">
                                <i data-feather="zap" className="w-6 h-6 text-white" style={{ fill: 'white' }}></i>
                            </div>
                            <div>
                            <h1 className="text-xl font-bold text-slate-800 leading-none">PowerCalc Pro</h1>
                            <p className="text-xs text-slate-500 mt-1">เครื่องคำนวณพลังงานไฟฟ้าอัจฉริยะ</p>
                            </div>
                        </div>
                        <div className="hidden md:flex items-center gap-2 text-xs bg-slate-100 px-3 py-1 rounded-full text-slate-600 font-medium">
                            <i data-feather="settings" className="w-3 h-3"></i> V 2.1 (HTML Version)
                        </div>
                        </div>
                    </div>

                    <main className="max-w-6xl mx-auto p-4 md:p-8 space-y-12">

                        {/* --- SECTION 1: Physics Calculator --- */}
                        <section>
                        <div className="flex items-center gap-3 mb-6">
                            <div className="bg-indigo-600 w-1 h-8 rounded-full"></div>
                            <h2 className="text-2xl font-bold text-slate-800">เครื่องคำนวณกฎทรงพลังงาน</h2>
                        </div>
                        
                        <div className="grid lg:grid-cols-12 gap-8 bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
                            
                            {/* Left: Interactive SVG Triangle */}
                            <div className="lg:col-span-5 bg-gradient-to-br from-slate-50 to-slate-100 p-8 flex flex-col items-center justify-center border-r border-slate-100 relative">
                            <div className="absolute top-4 left-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Interactive Mode</div>
                            
                            {/* SVG Magic Triangle */}
                            <div className="relative w-72 h-64 drop-shadow-2xl filter">
                                <svg viewBox="0 0 200 173.2" className="w-full h-full cursor-pointer select-none">
                                    <g onClick={() => handleModeChange('findW')} className="transition-all duration-300 group">
                                    <path d="M100 0 L150 86.6 L50 86.6 Z" 
                                            fill={calcMode === 'findW' ? '#9333ea' : '#d8b4fe'} 
                                            className="transition-colors duration-300 stroke-white stroke-2" />
                                    <text x="100" y="60" textAnchor="middle" fill="white" fontSize="24" fontWeight="bold">W</text>
                                    </g>
                                    <g onClick={() => handleModeChange('findP')} className="transition-all duration-300 group">
                                    <path d="M50 86.6 L100 86.6 L100 173.2 L0 173.2 Z" 
                                            fill={calcMode === 'findP' ? '#ea580c' : '#fdba74'} 
                                            className="transition-colors duration-300 stroke-white stroke-2" />
                                    <text x="50" y="145" textAnchor="middle" fill="white" fontSize="24" fontWeight="bold">P</text>
                                    </g>
                                    <g onClick={() => handleModeChange('findT')} className="transition-all duration-300 group">
                                    <path d="M100 86.6 L150 86.6 L200 173.2 L100 173.2 Z" 
                                            fill={calcMode === 'findT' ? '#2563eb' : '#93c5fd'} 
                                            className="transition-colors duration-300 stroke-white stroke-2" />
                                    <text x="150" y="145" textAnchor="middle" fill="white" fontSize="24" fontWeight="bold">t</text>
                                    </g>
                                </svg>
                            </div>

                            <div className="mt-8 text-center space-y-2">
                                <p className="text-slate-500 text-sm">คลิกที่ส่วนของสามเหลี่ยมเพื่อเปลี่ยนสูตร</p>
                                <div className={`inline-flex items-center px-4 py-2 rounded-full border ${getThemeColor()} transition-colors duration-300`}>
                                    <span className="font-bold mr-2">
                                        {calcMode === 'findW' && 'W'}
                                        {calcMode === 'findP' && 'P'}
                                        {calcMode === 'findT' && 't'}
                                    </span>
                                    <span className="text-sm font-medium">
                                        {calcMode === 'findW' && '= กำลังไฟฟ้า (P) × เวลา (t)'}
                                        {calcMode === 'findP' && '= พลังงาน (W) ÷ เวลา (t)'}
                                        {calcMode === 'findT' && '= พลังงาน (W) ÷ กำลังไฟฟ้า (P)'}
                                    </span>
                                </div>
                            </div>
                            </div>

                            {}
                            {/* Right: Inputs & Result */}
                            <div className="lg:col-span-7 p-8 flex flex-col justify-center">
                            <div className="space-y-6 max-w-md mx-auto w-full">
                                <div className="space-y-5">
                                    {calcMode === 'findW' && (
                                    <>
                                        <InputField label="กำลังไฟฟ้า (P)" unit="วัตต์ (W)" value={val1} onChange={setVal1} color="orange" icon="P"/>
                                        <div className="flex justify-center text-slate-300">
                                            <i data-feather="plus" className="w-5 h-5" style={{ transform: 'rotate(45deg)' }}></i>
                                        </div>
                                        <InputField label="เวลาที่ใช้ (t)" unit="วินาที (s)" value={val2} onChange={setVal2} color="blue" icon="t"/>
                                    </>
                                    )}
                                    {calcMode === 'findP' && (
                                    <>
                                        <InputField label="พลังงานไฟฟ้า (W)" unit="จูล (J)" value={val1} onChange={setVal1} color="purple" icon="W"/>
                                        <div className="flex justify-center text-slate-300 font-bold text-xl">÷</div>
                                        <InputField label="เวลาที่ใช้ (t)" unit="วินาที (s)" value={val2} onChange={setVal2} color="blue" icon="t"/>
                                    </>
                                    )}
                                    {calcMode === 'findT' && (
                                    <>
                                        <InputField label="พลังงานไฟฟ้า (W)" unit="จูล (J)" value={val1} onChange={setVal1} color="purple" icon="W"/>
                                        <div className="flex justify-center text-slate-300 font-bold text-xl">÷</div>
                                        <InputField label="กำลังไฟฟ้า (P)" unit="วัตต์ (W)" value={val2} onChange={setVal2} color="orange" icon="P"/>
                                    </>
                                    )}
                                </div>

                                <div className={`relative overflow-hidden rounded-2xl p-6 text-center transition-all duration-500 ${result !== null ? 'bg-slate-800 shadow-lg scale-100' : 'bg-slate-100 scale-95 opacity-80'}`}>
                                    <div className="relative z-10">
                                        <span className="text-slate-400 text-xs font-medium uppercase tracking-widest mb-1 block">ผลลัพธ์การคำนวณ</span>
                                        <div className="flex items-baseline justify-center gap-2">
                                        <span className="text-5xl font-bold text-white tracking-tight">
                                            {result !== null ? result.toLocaleString(undefined, { maximumFractionDigits: 2 }) : '0'}
                                        </span>
                                        <span className="text-xl font-medium text-slate-400">
                                            {calcMode === 'findW' ? 'J' : calcMode === 'findP' ? 'W' : 's'}
                                        </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            </div>
                        </div>
                        </section>

                        {}
                        {/* --- SECTION 2: Home Electricity Cost --- */}
                        <section>
                        {/* Header & Settings Control */}
                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-green-600 w-1 h-8 rounded-full"></div>
                                <div>
                                <h2 className="text-2xl font-bold text-slate-800">ประมาณการค่าไฟบ้าน</h2>
                                <p className="text-xs text-slate-500">คำนวณจากหน่วยไฟฟ้า (Unit) ที่ใช้จริง</p>
                                </div>
                            </div>
                            
                            {/* Mode Switcher */}
                            <div className="bg-white p-1 rounded-xl shadow-sm border border-slate-200 flex items-center gap-1 self-start md:self-auto">
                                <button 
                                onClick={() => setBillMode('progressive')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${billMode === 'progressive' ? 'bg-green-100 text-green-700 shadow-sm' : 'text-slate-500 hover:bg-slate-50'}`}
                                >
                                <i data-feather="file-text" className="w-4 h-4"></i> อัตราก้าวหน้า (กฟน.)
                                </button>
                                <button 
                                onClick={() => setBillMode('simple')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 ${billMode === 'simple' ? 'bg-slate-100 text-slate-700 shadow-sm' : 'text-slate-500 hover:bg-slate-50'}`}
                                >
                                <i data-feather="settings" className="w-4 h-4"></i> กำหนดเอง (คงที่)
                                </button>
                            </div>
                        </div>

                        <div className="grid lg:grid-cols-3 gap-8">
                            
                            {/* Form & Cost Settings */}
                            <div className="lg:col-span-1 space-y-6">
                            
                            {/* Cost Configuration Panel */}
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                <div className="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
                                <i data-feather="settings" className="w-4 h-4"></i> ตั้งค่าตัวแปร
                                </div>
                                
                                {billMode === 'simple' ? (
                                <div className="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                                    <span className="text-sm text-slate-500">ค่าไฟต่อหน่วย</span>
                                    <div className="flex items-center gap-2">
                                        <input 
                                        type="number" 
                                        value={unitPrice} 
                                        onChange={(e) => setUnitPrice(Number(e.target.value))}
                                        className="w-20 text-right font-bold text-slate-800 bg-white border border-slate-300 rounded-md px-2 py-1 outline-none focus:border-green-500"
                                        />
                                        <span className="text-xs text-slate-500">บาท</span>
                                    </div>
                                </div>
                                ) : (
                                <div className="space-y-3">
                                    <div className="flex items-center justify-between bg-green-50/50 p-3 rounded-xl border border-green-100">
                                    <div className="text-xs text-green-800">
                                        <div className="font-bold">โหมดคิดค่าไฟจริง</div>
                                        <div>(ตามประเภท 1 บ้านอยู่อาศัย)</div>
                                    </div>
                                    <i data-feather="check" className="w-5 h-5 text-green-600"></i>
                                    </div>
                                    <div className="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                                    <span className="text-sm text-slate-500">ค่า Ft (บาท/หน่วย)</span>
                                    <div className="flex items-center gap-2">
                                        <input 
                                            type="number" 
                                            value={ftRate} 
                                            onChange={(e) => setFtRate(Number(e.target.value))}
                                            className="w-20 text-right font-bold text-slate-800 bg-white border border-slate-300 rounded-md px-2 py-1 outline-none focus:border-green-500"
                                            step="0.0001"
                                        />
                                        <span className="text-xs text-slate-500">บาท</span>
                                    </div>
                                    </div>
                                </div>
                                )}
                            </div>

                            {}
                            {/* Add Appliance Form */}
                            <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-100 sticky top-24">
                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                                <div className="bg-green-100 p-1.5 rounded-md"><i data-feather="plus" className="w-4 h-4 text-green-600"></i></div>
                                เพิ่มรายการใหม่
                                </h3>
                                <form onSubmit={addAppliance} className="space-y-4">
                                <div className="space-y-1">
                                    <label className="text-xs font-medium text-slate-500 ml-1">ชื่อเครื่องใช้ไฟฟ้า</label>
                                    <input 
                                        type="text" 
                                        placeholder="เช่น แอร์, พัดลม" 
                                        value={newItem.name}
                                        onChange={(e) => setNewItem({...newItem, name: e.target.value})}
                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-green-500/20 focus:border-green-500 outline-none transition"
                                    />
                                </div>
                                
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="space-y-1">
                                        <label className="text-xs font-medium text-slate-500 ml-1">กำลังไฟ (W)</label>
                                        <input 
                                        type="number" 
                                        placeholder="0" 
                                        value={newItem.watts}
                                        onChange={(e) => setNewItem({...newItem, watts: e.target.value})}
                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-green-500/20 focus:border-green-500 outline-none transition text-center"
                                        />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-xs font-medium text-slate-500 ml-1">จำนวน</label>
                                        <div className="flex items-center">
                                            <button type="button" onClick={() => setNewItem({...newItem, quantity: Math.max(1, parseInt(newItem.quantity || 1) - 1)})} className="p-3 bg-slate-100 rounded-l-xl border border-r-0 border-slate-200 hover:bg-slate-200">-</button>
                                            <input 
                                            type="number" 
                                            value={newItem.quantity}
                                            onChange={(e) => setNewItem({...newItem, quantity: e.target.value})}
                                            className="w-full p-3 bg-slate-50 border-y border-slate-200 focus:ring-0 outline-none text-center"
                                            />
                                            <button type="button" onClick={() => setNewItem({...newItem, quantity: parseInt(newItem.quantity || 1) + 1})} className="p-3 bg-slate-100 rounded-r-xl border border-l-0 border-slate-200 hover:bg-slate-200">+</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-1">
                                    <label className="text-xs font-medium text-slate-500 ml-1">ชั่วโมงใช้งาน / วัน</label>
                                    <input 
                                        type="number" 
                                        placeholder="0" 
                                        value={newItem.hours}
                                        onChange={(e) => setNewItem({...newItem, hours: e.target.value})}
                                        className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-green-500/20 focus:border-green-500 outline-none transition"
                                    />
                                </div>

                                <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl shadow-lg shadow-slate-900/20 transition-all flex items-center justify-center gap-2 mt-2">
                                    <i data-feather="plus" className="w-5 h-5"></i> เพิ่มรายการ
                                </button>
                                </form>
                            </div>
                            </div>

                            {}
                            {/* List & Summary Area */}
                            <div className="lg:col-span-2 flex flex-col gap-6">
                            
                            {/* Summary Cards */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <SummaryCard 
                                    title="ใช้ไฟต่อเดือน" 
                                    value={totalMonthlyUnits.toLocaleString(undefined, {maximumFractionDigits: 0})} 
                                    unit="หน่วย (Unit)" 
                                    icon={<i data-feather="zap" className="w-5 h-5 text-yellow-500"></i>}
                                    bgColor="bg-slate-800"
                                    textColor="text-white"
                                    subtext={`เฉลี่ย ${totalDailyUnits.toFixed(1)} หน่วย/วัน`}
                                />
                                <SummaryCard 
                                    title="ค่าไฟต่อเดือน (โดยประมาณ)" 
                                    value={monthlyBillData.grandTotal.toLocaleString(undefined, {maximumFractionDigits: 2})} 
                                    unit="บาท" 
                                    icon={<i data-feather="dollar-sign" className="w-5 h-5 text-green-500"></i>}
                                    bgColor="bg-white"
                                    textColor="text-slate-800"
                                    borderColor="border-green-200"
                                    subtext={billMode === 'progressive' ? 'รวมค่าบริการ + Ft + VAT แล้ว' : `@ ${unitPrice} บ./หน่วย (ไม่รวม VAT)`}
                                    highlight
                                />
                                <SummaryCard 
                                    title="ค่าไฟต่อปี" 
                                    value={totalYearlyCost.toLocaleString(undefined, {maximumFractionDigits: 0})} 
                                    unit="บาท" 
                                    icon={<i data-feather="home" className="w-5 h-5 text-blue-500"></i>}
                                    bgColor="bg-white"
                                    textColor="text-slate-800"
                                    borderColor="border-blue-200"
                                />
                            </div>

                            {/* Bill Breakdown (เฉพาะโหมด Progressive) */}
                            {billMode === 'progressive' && (
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                <h4 className="font-bold text-slate-700 mb-4 pb-2 border-b border-slate-100 flex items-center justify-between">
                                    <span>รายละเอียดบิลค่าไฟฟ้า (Estimate Bill)</span>
                                    <span className="text-xs font-normal text-white bg-green-600 px-2 py-1 rounded">{monthlyBillData.rateType}</span>
                                </h4>
                                <div className="space-y-3 text-sm">
                                    <div className="flex justify-between text-slate-600">
                                        <span>ค่าพลังงานไฟฟ้า (Base Tariff)</span>
                                        <span>{monthlyBillData.energyCharge.toLocaleString(undefined, {maximumFractionDigits: 2})} บาท</span>
                                    </div>
                                    <div className="flex justify-between text-slate-600">
                                        <span>ค่าบริการรายเดือน (Service Charge)</span>
                                        <span>{monthlyBillData.serviceCharge.toFixed(2)} บาท</span>
                                    </div>
                                    <div className="flex justify-between text-slate-600">
                                        <span>ค่า Ft ({ftRate} บ./หน่วย)</span>
                                        <span>{monthlyBillData.ftCharge.toLocaleString(undefined, {maximumFractionDigits: 2})} บาท</span>
                                    </div>
                                    <div className="flex justify-between text-slate-600 font-medium pt-2 border-t border-dashed border-slate-200">
                                        <span>รวมเงินก่อนภาษี</span>
                                        <span>{(monthlyBillData.energyCharge + monthlyBillData.serviceCharge + monthlyBillData.ftCharge).toLocaleString(undefined, {maximumFractionDigits: 2})} บาท</span>
                                    </div>
                                    <div className="flex justify-between text-slate-600">
                                        <span>ภาษีมูลค่าเพิ่ม 7% (VAT)</span>
                                        <span>{monthlyBillData.vat.toLocaleString(undefined, {maximumFractionDigits: 2})} บาท</span>
                                    </div>
                                    <div className="flex justify-between text-slate-800 font-bold text-lg pt-2 border-t border-slate-200 mt-2">
                                        <span>ยอดรวมสุทธิ</span>
                                        <span className="text-green-600">{monthlyBillData.grandTotal.toLocaleString(undefined, {maximumFractionDigits: 2})} บาท</span>
                                    </div>
                                </div>
                                </div>
                            )}

                            {}
                            {/* Table */}
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-grow">
                                <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider">
                                            <th className="px-6 py-4 font-medium">อุปกรณ์ไฟฟ้า</th>
                                            <th className="px-6 py-4 font-medium text-center">กำลังไฟ (W)</th>
                                            <th className="px-6 py-4 font-medium text-center">เวลา (ชม.)</th>
                                            <th className="px-6 py-4 font-medium text-center">หน่วย/เดือน</th>
                                            <th className="px-6 py-4 font-medium text-center">จัดการ</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {appliances.map((item) => {
                                        const dailyUnits = (item.watts / 1000) * item.hours * item.quantity;
                                        const monthlyUnits = dailyUnits * 30;
                                        return (
                                            <tr key={item.id} className="hover:bg-slate-50/80 transition-colors group">
                                            <td className="px-6 py-4">
                                                <div className="font-semibold text-slate-700">{item.name}</div>
                                                <div className="text-xs text-slate-400 mt-1 flex items-center gap-1">
                                                    <span className="bg-slate-100 px-1.5 py-0.5 rounded">x{item.quantity} เครื่อง</span>
                                                </div>
                                            </td>
                                            <td className="px-6 py-4 text-center">
                                                <span className="bg-orange-50 text-orange-700 px-2 py-1 rounded-md font-medium text-xs">{item.watts} W</span>
                                            </td>
                                            <td className="px-6 py-4 text-center">
                                                <span className="bg-blue-50 text-blue-700 px-2 py-1 rounded-md font-medium text-xs">{item.hours} ชม.</span>
                                            </td>
                                            <td className="px-6 py-4 text-center">
                                                <div className="font-bold text-slate-800">{monthlyUnits.toFixed(1)}</div>
                                            </td>
                                            <td className="px-6 py-4 text-center">
                                                <button 
                                                onClick={() => removeAppliance(item.id)} 
                                                className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-all"
                                                title="ลบรายการ"
                                                >
                                                <i data-feather="trash-2" className="w-4 h-4"></i>
                                                </button>
                                            </td>
                                            </tr>
                                        );
                                        })}
                                    </tbody>
                                </table>
                                </div>
                            </div>

                            </div>
                        </div>
                        </section>

                    </main>
                </div>
            );
        };

        // --- Sub-components for cleaner code ---

        const InputField = ({ label, unit, value, onChange, color, icon }) => {
            const colorStyles = {
                purple: 'focus:border-purple-500 focus:ring-purple-500/20 bg-purple-50/50 text-purple-700',
                orange: 'focus:border-orange-500 focus:ring-orange-500/20 bg-orange-50/50 text-orange-700',
                blue: 'focus:border-blue-500 focus:ring-blue-500/20 bg-blue-50/50 text-blue-700'
            };

            const iconColors = {
                purple: 'bg-purple-500',
                orange: 'bg-orange-500',
                blue: 'bg-blue-500'
            };

            return (
                <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide ml-1">{label}</label>
                <div className="relative group">
                    <div className={`absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none`}>
                        <span className={`w-8 h-8 rounded-lg ${iconColors[color]} text-white flex items-center justify-center font-bold text-sm shadow-sm`}>{icon}</span>
                    </div>
                    <input 
                        type="number" 
                        value={value} 
                        onChange={(e) => onChange(e.target.value)} 
                        className={`w-full pl-14 pr-16 py-3.5 border border-slate-200 rounded-2xl outline-none transition-all font-semibold text-lg ${colorStyles[color]}`} 
                        placeholder="0" 
                    />
                    <div className="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                        <span className="text-slate-400 text-xs font-medium">{unit}</span>
                    </div>
                </div>
                </div>
            );
        };

        const SummaryCard = ({ title, value, unit, icon, bgColor, textColor, borderColor = 'border-transparent', subtext, highlight }) => (
            <div className={`${bgColor} p-5 rounded-2xl shadow-sm border ${borderColor} relative overflow-hidden group hover:shadow-md transition-all ${highlight ? 'ring-2 ring-green-100' : ''}`}>
                <div className="flex justify-between items-start mb-2 relative z-10">
                    <span className={`text-xs font-medium ${textColor === 'text-white' ? 'text-slate-300' : 'text-slate-500'}`}>{title}</span>
                    {icon}
                </div>
                <div className={`text-2xl font-bold ${textColor} relative z-10`}>
                    {value} <span className="text-sm font-normal opacity-70">{unit}</span>
                </div>
                {subtext && <div className="text-[10px] opacity-70 mt-1 relative z-10">{subtext}</div>}
                
                {/* Decoration */}
                <div className="absolute -bottom-4 -right-4 w-20 h-20 rounded-full bg-current opacity-5 group-hover:scale-150 transition-transform duration-500"></div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ElectricalDashboard />);
    </script>
</body>
</html>
