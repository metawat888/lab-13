<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerCalc Pro - Transformer Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- Google Fonts: Inter & Noto Sans Thai -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+Thai:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Noto Sans Thai', 'sans-serif'] },
                    colors: {
                        cyber: {
                            purple: '#c084fc', // W
                            orange: '#fb923c', // P
                            blue: '#38bdf8',   // t
                            green: '#4ade80',  // Money
                            dark: '#020617',   // Background
                            panel: '#0f172a',  // Card
                            border: '#1e293b'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            background-image: 
                linear-gradient(rgba(30, 41, 59, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.5) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }

        /* Sci-Fi Glass Panels */
        .cyber-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .cyber-header {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }

        /* Glow Effects */
        .glow-purple { text-shadow: 0 0 15px rgba(192, 132, 252, 0.8); }
        .glow-orange { text-shadow: 0 0 15px rgba(251, 146, 60, 0.8); }
        .glow-blue { text-shadow: 0 0 15px rgba(56, 189, 248, 0.8); }
        .glow-green { text-shadow: 0 0 15px rgba(74, 222, 128, 0.8); }

        .shadow-glow-purple { box-shadow: 0 0 20px rgba(192, 132, 252, 0.3); border-color: rgba(192, 132, 252, 0.5); }
        .shadow-glow-orange { box-shadow: 0 0 20px rgba(251, 146, 60, 0.3); border-color: rgba(251, 146, 60, 0.5); }
        .shadow-glow-blue { box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); border-color: rgba(56, 189, 248, 0.5); }

        /* Input Styles */
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .cyber-input {
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.8);
            color: white;
            transition: all 0.3s ease;
        }
        .cyber-input:focus {
            background: rgba(15, 23, 42, 0.9);
            outline: none;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="pb-24 overflow-x-hidden">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // แยก Component ลูกออกมาให้ถูกต้องตามหลัก React (ประกาศภายนอกฟังก์ชันหลัก)
        const TransformerTriangle = ({ mode, setMode }) => {
            const [hovered, setHovered] = useState(null);

            // Transformer Logic: Caculate separation (แยกร่าง) based on selected mode
            const getTransform = (piece) => {
                const isSelected = mode === piece;
                const isHovered = hovered === piece;
                
                // Base transform origins to center of each piece
                let baseTx = 0, baseTy = 0, scale = 1;

                if (isSelected) {
                    // Selected piece pops out dramatically
                    scale = 1.15;
                    if (piece === 'findW') { baseTy = -40; }
                    if (piece === 'findP') { baseTx = -40; baseTy = 30; }
                    if (piece === 'findT') { baseTx = 40; baseTy = 30; }
                } else {
                    // Non-selected pieces retreat and shrink slightly
                    scale = 0.9;
                    if (piece === 'findW') { baseTy = 15; }
                    if (piece === 'findP') { baseTx = 15; baseTy = -10; }
                    if (piece === 'findT') { baseTx = -15; baseTy = -10; }
                }

                // Add slight movement on hover if not already selected
                if (isHovered && !isSelected) {
                    scale = 0.95;
                    if (piece === 'findW') { baseTy -= 10; }
                    if (piece === 'findP') { baseTx -= 10; baseTy += 10; }
                    if (piece === 'findT') { baseTx += 10; baseTy += 10; }
                }

                return `translate(${baseTx}px, ${baseTy}px) scale(${scale})`;
            };

            const getOpacity = (piece) => (mode === piece ? 1 : 0.4);

            return (
                <div className="w-full h-80 flex items-center justify-center relative">
                    {/* Glowing Core Background */}
                    <div className={`absolute w-32 h-32 rounded-full blur-[60px] opacity-50 transition-colors duration-700
                        ${mode === 'findW' ? 'bg-purple-600' : mode === 'findP' ? 'bg-orange-600' : 'bg-blue-600'}`}>
                    </div>

                    <div className="w-72 h-72 relative z-10">
                        <svg viewBox="-20 -20 240 240" className="w-full h-full overflow-visible drop-shadow-2xl">
                            <defs>
                                {/* Futuristic Filters */}
                                <filter id="glow-w"><feDropShadow dx="0" dy="0" stdDeviation="8" floodColor="#c084fc" floodOpacity="0.8"/></filter>
                                <filter id="glow-p"><feDropShadow dx="0" dy="0" stdDeviation="8" floodColor="#fb923c" floodOpacity="0.8"/></filter>
                                <filter id="glow-t"><feDropShadow dx="0" dy="0" stdDeviation="8" floodColor="#38bdf8" floodOpacity="0.8"/></filter>
                            </defs>

                            {/* W Section (Top) */}
                            <g 
                                onClick={() => setMode('findW')}
                                onMouseEnter={() => setHovered('findW')}
                                onMouseLeave={() => setHovered(null)}
                                className="cursor-pointer"
                                style={{ 
                                    transform: getTransform('findW'), 
                                    transformOrigin: '100px 60px',
                                    opacity: getOpacity('findW'),
                                    transition: 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)' 
                                }}
                            >
                                <path d="M100 10 L145 82 L55 82 Z" fill="#1e1b4b" stroke="#c084fc" strokeWidth="3" filter={mode === 'findW' ? "url(#glow-w)" : ""} />
                                {/* Detail lines */}
                                <path d="M100 25 L130 75 L70 75 Z" fill="none" stroke="rgba(192, 132, 252, 0.3)" strokeWidth="1" />
                                <text x="100" y="65" textAnchor="middle" fill="#c084fc" fontSize="28" fontWeight="900" className="glow-purple" style={{ pointerEvents: 'none' }}>W</text>
                            </g>
                            
                            {/* P Section (Bottom Left) */}
                            <g 
                                onClick={() => setMode('findP')}
                                onMouseEnter={() => setHovered('findP')}
                                onMouseLeave={() => setHovered(null)}
                                className="cursor-pointer"
                                style={{ 
                                    transform: getTransform('findP'), 
                                    transformOrigin: '70px 130px',
                                    opacity: getOpacity('findP'),
                                    transition: 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)' 
                                }}
                            >
                                <path d="M52 88 L98 88 L98 168 L8 168 Z" fill="#431407" stroke="#fb923c" strokeWidth="3" filter={mode === 'findP' ? "url(#glow-p)" : ""} />
                                <path d="M45 98 L88 98 L88 158 L25 158 Z" fill="none" stroke="rgba(251, 146, 60, 0.3)" strokeWidth="1" />
                                <text x="55" y="140" textAnchor="middle" fill="#fb923c" fontSize="28" fontWeight="900" className="glow-orange" style={{ pointerEvents: 'none' }}>P</text>
                            </g>

                            {/* t Section (Bottom Right) */}
                            <g 
                                onClick={() => setMode('findT')}
                                onMouseEnter={() => setHovered('findT')}
                                onMouseLeave={() => setHovered(null)}
                                className="cursor-pointer"
                                style={{ 
                                    transform: getTransform('findT'), 
                                    transformOrigin: '130px 130px',
                                    opacity: getOpacity('findT'),
                                    transition: 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)' 
                                }}
                            >
                                <path d="M102 88 L148 88 L192 168 L102 168 Z" fill="#082f49" stroke="#38bdf8" strokeWidth="3" filter={mode === 'findT' ? "url(#glow-t)" : ""} />
                                <path d="M112 98 L155 98 L175 158 L112 158 Z" fill="none" stroke="rgba(56, 189, 248, 0.3)" strokeWidth="1" />
                                <text x="145" y="140" textAnchor="middle" fill="#38bdf8" fontSize="28" fontWeight="900" className="glow-blue" style={{ pointerEvents: 'none' }}>t</text>
                            </g>

                        </svg>
                    </div>
                </div>
            );
        };

        const CyberInput = ({ label, unit, value, onChange, color, icon }) => {
            const colorMap = {
                purple: 'focus:border-cyber-purple shadow-glow-purple text-cyber-purple',
                orange: 'focus:border-cyber-orange shadow-glow-orange text-cyber-orange',
                blue: 'focus:border-cyber-blue shadow-glow-blue text-cyber-blue'
            };
            const iconBg = {
                purple: 'bg-purple-900/50 text-purple-400 border-purple-500/50',
                orange: 'bg-orange-900/50 text-orange-400 border-orange-500/50',
                blue: 'bg-blue-900/50 text-blue-400 border-blue-500/50'
            };

            return (
                <div className="mb-4">
                    <label className="block text-xs font-bold text-slate-400 mb-2 ml-1 uppercase tracking-[0.2em]">{label}</label>
                    <div className="relative group">
                        <div className={`absolute inset-y-1 left-1 w-10 flex items-center justify-center rounded-lg border ${iconBg[color]} font-black backdrop-blur-sm z-10`}>
                            {icon}
                        </div>
                        <input 
                            type="number" 
                            value={value} 
                            onChange={(e) => onChange(e.target.value)} 
                            className={`w-full cyber-input pl-14 pr-16 py-3 rounded-xl text-right font-black text-2xl outline-none ${value ? colorMap[color] : 'focus:border-slate-500'}`} 
                            placeholder="0.00" 
                        />
                        <div className="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <span className="text-slate-500 font-bold uppercase">{unit}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const ElectricalDashboard = () => {
            const [calcMode, setCalcMode] = useState('findW'); 
            const [val1, setVal1] = useState('');
            const [val2, setVal2] = useState('');
            const [result, setResult] = useState(null);

            const [appliances, setAppliances] = useState([
                { id: 1, name: 'Air Conditioner (12,000 BTU)', watts: 1200, hours: 8, quantity: 1 },
                { id: 2, name: 'Cyber Refrigerator', watts: 150, hours: 24, quantity: 1 },
            ]);
            const [newItem, setNewItem] = useState({ name: '', watts: '', hours: '', quantity: 1 });
            const [billMode, setBillMode] = useState('progressive'); 
            const [unitPrice, setUnitPrice] = useState(4.5); 
            const [ftRate, setFtRate] = useState(0.3972); 

            const calculatePhysics = () => {
                const v1 = parseFloat(val1);
                const v2 = parseFloat(val2);
                if (isNaN(v1) || isNaN(v2) || val1 === '' || val2 === '') { setResult(null); return; }
                let res = 0;
                if (calcMode === 'findW') res = v1 * v2;      
                else if (calcMode === 'findP') res = v1 / v2; 
                else if (calcMode === 'findT') res = v1 / v2; 
                setResult(res);
            };

            useEffect(() => { calculatePhysics(); }, [val1, val2, calcMode]);
            
            useEffect(() => { if (window.feather) window.feather.replace(); });

            const addAppliance = (e) => {
                e.preventDefault();
                if (!newItem.name || !newItem.watts || !newItem.hours) return;
                setAppliances([...appliances, { ...newItem, id: Date.now() }]);
                setNewItem({ name: '', watts: '', hours: '', quantity: 1 });
            };

            const removeAppliance = (id) => setAppliances(appliances.filter(app => app.id !== id));

            const totalDailyUnits = appliances.reduce((sum, item) => sum + ((item.watts / 1000) * item.hours * item.quantity), 0);
            const totalMonthlyUnits = totalDailyUnits * 30;

            const calculateProgressiveBill = (units) => {
                let energyCharge = 0, serviceCharge = 0, rateType = '';
                if (units <= 150) {
                    rateType = 'TYPE 1.1 (≤150U)'; serviceCharge = 8.19;
                    const step1 = Math.min(units, 15); energyCharge += step1 * 2.3488; let remaining = units - step1;
                    if (remaining > 0) { const step2 = Math.min(remaining, 10); energyCharge += step2 * 2.9882; remaining -= step2; }
                    if (remaining > 0) { const step3 = Math.min(remaining, 10); energyCharge += step3 * 3.2405; remaining -= step3; }
                    if (remaining > 0) { const step4 = Math.min(remaining, 65); energyCharge += step4 * 3.6237; remaining -= step4; }
                    if (remaining > 0) { const step5 = Math.min(remaining, 50); energyCharge += step5 * 3.7171; remaining -= step5; }
                    if (remaining > 0) { const step6 = Math.min(remaining, 250); energyCharge += step6 * 4.2218; remaining -= step6; }
                    if (remaining > 0) { energyCharge += remaining * 4.4217; }
                } else {
                    rateType = 'TYPE 1.2 (>150U)'; serviceCharge = 24.62;
                    const step1 = 150; energyCharge += step1 * 3.2484; let remaining = units - step1;
                    if (remaining > 0) { const step2 = Math.min(remaining, 250); energyCharge += step2 * 4.2218; remaining -= step2; }
                    if (remaining > 0) { energyCharge += remaining * 4.4217; }
                }
                const ftCharge = units * ftRate;
                const totalBeforeVat = energyCharge + serviceCharge + ftCharge;
                const vat = totalBeforeVat * 0.07;
                return { energyCharge, serviceCharge, ftCharge, vat, grandTotal: totalBeforeVat + vat, rateType };
            };

            let monthlyBillData = billMode === 'progressive' 
                ? calculateProgressiveBill(totalMonthlyUnits) 
                : { grandTotal: totalMonthlyUnits * unitPrice, energyCharge: totalMonthlyUnits * unitPrice, serviceCharge: 0, ftCharge: 0, vat: 0, rateType: 'CUSTOM FIXED' };

            const totalYearlyCost = monthlyBillData.grandTotal * 12;

            return (
                <div className="min-h-screen">
                    
                    {/* --- UNIFIED CYBER HEADER --- */}
                    <header className="cyber-header sticky top-0 z-50 py-3 px-4 sm:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-[0_0_15px_rgba(99,102,241,0.5)] border border-indigo-400/50">
                                <i data-feather="cpu" className="text-white"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-black text-white tracking-widest uppercase">PowerCalc <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400">TF-EDITION</span></h1>
                            </div>
                        </div>

                        {/* Top Global Controls (Moved Next to Settings) */}
                        <div className="flex flex-wrap items-center gap-3 bg-slate-900/80 p-1.5 px-2 rounded-xl border border-slate-700 backdrop-blur-md">
                            <div className="flex gap-1">
                                <button 
                                    onClick={() => setBillMode('progressive')}
                                    className={`px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-300 ${billMode === 'progressive' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/50 shadow-[0_0_10px_rgba(79,70,229,0.3)]' : 'text-slate-400 hover:text-white border border-transparent'}`}
                                >
                                    <span className="flex items-center gap-2"><i data-feather="trending-up" className="w-3 h-3"></i> กฟน.</span>
                                </button>
                                <button 
                                    onClick={() => setBillMode('simple')}
                                    className={`px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all duration-300 ${billMode === 'simple' ? 'bg-orange-600/20 text-orange-400 border border-orange-500/50 shadow-[0_0_10px_rgba(249,115,22,0.3)]' : 'text-slate-400 hover:text-white border border-transparent'}`}
                                >
                                    <span className="flex items-center gap-2"><i data-feather="crosshair" className="w-3 h-3"></i> กำหนดเอง</span>
                                </button>
                            </div>

                            <div className="h-6 w-px bg-slate-700 mx-1 hidden sm:block"></div>

                            {/* Parameter Settings based on mode */}
                            {billMode === 'simple' ? (
                                <div className="flex items-center gap-2 px-2">
                                    <span className="text-xs font-bold text-slate-500 uppercase">Rate:</span>
                                    <input 
                                        type="number" value={unitPrice} onChange={(e) => setUnitPrice(Number(e.target.value))}
                                        className="w-16 font-black text-orange-400 bg-transparent border-b border-slate-600 focus:border-orange-400 outline-none text-center"
                                    />
                                    <span className="text-xs font-bold text-slate-500">THB/U</span>
                                </div>
                            ) : (
                                <div className="flex items-center gap-2 px-2">
                                    <span className="text-xs font-bold text-slate-500 uppercase">Ft:</span>
                                    <input 
                                        type="number" value={ftRate} onChange={(e) => setFtRate(Number(e.target.value))} step="0.0001"
                                        className="w-20 font-black text-indigo-400 bg-transparent border-b border-slate-600 focus:border-indigo-400 outline-none text-center"
                                    />
                                    <span className="text-xs font-bold text-slate-500">THB/U</span>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 sm:px-8 py-10 space-y-12">

                        {/* */}
                        <section>
                            <div className="flex items-center gap-3 mb-6">
                                <div className="w-8 h-8 rounded bg-slate-800 border border-slate-700 flex items-center justify-center"><i data-feather="hexagon" className="text-purple-400 w-4 h-4"></i></div>
                                <h2 className="text-xl font-black text-white tracking-widest uppercase glow-purple">Physics Core <span className="text-slate-500 font-medium text-sm">W=Pt</span></h2>
                            </div>
                            
                            <div className="grid lg:grid-cols-2 gap-8">
                                {/* LEFT: Transformer Triangle */}
                                <div className="cyber-panel p-8 flex flex-col items-center justify-center relative overflow-hidden group">
                                    <div className="absolute top-4 left-4 flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">System Online</span>
                                    </div>
                                    
                                    {/* The magic happens here */}
                                    <TransformerTriangle mode={calcMode} setMode={setCalcMode} />
                                    
                                    <div className="mt-4 text-center z-10 w-full">
                                        <div className="bg-slate-900/80 border border-slate-700 rounded-xl p-4 flex items-center justify-between backdrop-blur-sm">
                                            <div className="text-left">
                                                <div className="text-[10px] text-slate-500 uppercase tracking-widest mb-1">Active Formula</div>
                                                <div className="text-lg font-black text-white font-mono">
                                                    {calcMode === 'findW' && <><span className="text-purple-400 glow-purple">W</span> = P × t</>}
                                                    {calcMode === 'findP' && <><span className="text-orange-400 glow-orange">P</span> = W ÷ t</>}
                                                    {calcMode === 'findT' && <><span className="text-blue-400 glow-blue">t</span> = W ÷ P</>}
                                                </div>
                                            </div>
                                            <i data-feather="activity" className={`w-6 h-6 ${calcMode==='findW'?'text-purple-500':calcMode==='findP'?'text-orange-500':'text-blue-500'}`}></i>
                                        </div>
                                    </div>
                                </div>

                                {/* RIGHT: HUD Inputs & Result */}
                                <div className="cyber-panel p-8 flex flex-col justify-between relative overflow-hidden">
                                    {/* Tech Background pattern */}
                                    <i data-feather="crosshair" className="absolute -right-10 -bottom-10 w-64 h-64 text-slate-800 opacity-30 stroke-[0.5]"></i>
                                    
                                    <div className="space-y-4 relative z-10">
                                        {calcMode === 'findW' && (
                                            <>
                                                <CyberInput label="Power (P)" unit="Watt" value={val1} onChange={setVal1} color="orange" icon="P"/>
                                                <div className="flex justify-center -my-3 relative z-10"><div className="w-8 h-8 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-slate-400 font-bold text-xl backdrop-blur-md">×</div></div>
                                                <CyberInput label="Time (t)" unit="Sec" value={val2} onChange={setVal2} color="blue" icon="t"/>
                                            </>
                                        )}
                                        {calcMode === 'findP' && (
                                            <>
                                                <CyberInput label="Work/Energy (W)" unit="Joule" value={val1} onChange={setVal1} color="purple" icon="W"/>
                                                <div className="flex justify-center -my-3 relative z-10"><div className="w-8 h-8 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-slate-400 font-bold text-xl backdrop-blur-md">÷</div></div>
                                                <CyberInput label="Time (t)" unit="Sec" value={val2} onChange={setVal2} color="blue" icon="t"/>
                                            </>
                                        )}
                                        {calcMode === 'findT' && (
                                            <>
                                                <CyberInput label="Work/Energy (W)" unit="Joule" value={val1} onChange={setVal1} color="purple" icon="W"/>
                                                <div className="flex justify-center -my-3 relative z-10"><div className="w-8 h-8 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-slate-400 font-bold text-xl backdrop-blur-md">÷</div></div>
                                                <CyberInput label="Power (P)" unit="Watt" value={val2} onChange={setVal2} color="orange" icon="P"/>
                                            </>
                                        )}
                                    </div>

                                    {/* 3D Digital Result Screen */}
                                    <div className={`mt-8 bg-black/50 border rounded-2xl p-6 text-center relative overflow-hidden transition-all duration-500
                                        ${result !== null 
                                            ? (calcMode==='findW' ? 'border-purple-500 shadow-[inset_0_0_20px_rgba(192,132,252,0.2)]' 
                                            : calcMode==='findP' ? 'border-orange-500 shadow-[inset_0_0_20px_rgba(251,146,60,0.2)]' 
                                            : 'border-blue-500 shadow-[inset_0_0_20px_rgba(56,189,248,0.2)]') 
                                            : 'border-slate-800'}`}>
                                        
                                        <div className="absolute inset-0 bg-[linear-gradient(transparent_50%,rgba(0,0,0,0.5)_50%)] bg-[length:100%_4px] pointer-events-none opacity-20"></div>
                                        
                                        <span className="text-[10px] font-black uppercase tracking-[0.3em] opacity-50 block mb-2 text-slate-400">Output Terminal</span>
                                        <div className="flex items-baseline justify-center gap-3 font-mono">
                                            <span className={`text-5xl sm:text-6xl font-black tracking-tighter
                                                ${result !== null ? (calcMode==='findW'?'text-purple-400 glow-purple':calcMode==='findP'?'text-orange-400 glow-orange':'text-blue-400 glow-blue') : 'text-slate-600'}`}>
                                                {result !== null ? result.toLocaleString(undefined, { maximumFractionDigits: 2 }) : '0.00'}
                                            </span>
                                            <span className="text-2xl font-bold opacity-60 text-slate-400">
                                                {calcMode === 'findW' ? 'J' : calcMode === 'findP' ? 'W' : 's'}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* */}
                        <section>
                            <div className="flex items-center gap-3 mb-6">
                                <div className="w-8 h-8 rounded bg-slate-800 border border-slate-700 flex items-center justify-center"><i data-feather="zap" className="text-green-400 w-4 h-4"></i></div>
                                <h2 className="text-xl font-black text-white tracking-widest uppercase glow-green">Grid Simulation <span className="text-slate-500 font-medium text-sm">Billing</span></h2>
                            </div>

                            <div className="grid lg:grid-cols-3 gap-8">
                                
                                {/* Form */}
                                <div className="lg:col-span-1">
                                    <div className="cyber-panel p-6 sticky top-24">
                                        <h3 className="font-bold text-white mb-5 flex items-center gap-2 uppercase tracking-wide text-sm">
                                            <i data-feather="plus-square" className="w-4 h-4 text-green-400"></i> Add Appliance
                                        </h3>
                                        <form onSubmit={addAppliance} className="space-y-4">
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 ml-1">Device ID/Name</label>
                                                <input type="text" value={newItem.name} onChange={(e) => setNewItem({...newItem, name: e.target.value})} className="w-full cyber-input rounded-lg p-3 text-sm font-bold" placeholder="e.g. A/C, TV..." />
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 ml-1">Power (W)</label>
                                                    <input type="number" value={newItem.watts} onChange={(e) => setNewItem({...newItem, watts: e.target.value})} className="w-full cyber-input rounded-lg p-3 text-sm font-bold text-orange-400 text-center" placeholder="0" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 ml-1">Quantity</label>
                                                    <input type="number" value={newItem.quantity} onChange={(e) => setNewItem({...newItem, quantity: e.target.value})} className="w-full cyber-input rounded-lg p-3 text-sm font-bold text-center" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 ml-1">Usage (Hrs/Day)</label>
                                                <input type="number" value={newItem.hours} onChange={(e) => setNewItem({...newItem, hours: e.target.value})} className="w-full cyber-input rounded-lg p-3 text-sm font-bold text-blue-400 text-center" placeholder="0" />
                                            </div>
                                            <button type="submit" className="w-full bg-green-500/20 hover:bg-green-500/30 text-green-400 border border-green-500/50 py-3 rounded-lg font-black uppercase tracking-[0.2em] transition-all shadow-[0_0_10px_rgba(74,222,128,0.2)] hover:shadow-[0_0_20px_rgba(74,222,128,0.4)] mt-4 text-xs">
                                                Initialize
                                            </button>
                                        </form>
                                    </div>
                                </div>

                                {/* Table & Summaries */}
                                <div className="lg:col-span-2 flex flex-col gap-8">
                                    
                                    {/* 3D Summaries */}
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                                        <div className="cyber-panel p-5 relative overflow-hidden group">
                                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Monthly Load</div>
                                            <div className="text-3xl font-black text-white">{totalMonthlyUnits.toLocaleString(undefined, {maximumFractionDigits:0})} <span className="text-sm font-normal opacity-50">kWh</span></div>
                                            <div className="text-[10px] text-slate-500 mt-2 font-mono">≈ {totalDailyUnits.toFixed(1)} kWh/Day</div>
                                        </div>
                                        
                                        <div className="cyber-panel p-5 relative overflow-hidden border-green-500/30 shadow-[inset_0_0_20px_rgba(74,222,128,0.05)]">
                                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Est. Bill (Month)</div>
                                            <div className="text-3xl font-black text-green-400 glow-green">฿{monthlyBillData.grandTotal.toLocaleString(undefined, {maximumFractionDigits:0})}</div>
                                            <div className="text-[10px] font-bold text-green-400 bg-green-400/10 border border-green-400/20 px-2 py-0.5 rounded-full inline-block mt-2 tracking-wider">{monthlyBillData.rateType}</div>
                                        </div>

                                        <div className="cyber-panel p-5 relative overflow-hidden border-blue-500/30">
                                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Projection (Year)</div>
                                            <div className="text-3xl font-black text-blue-400 glow-blue">฿{totalYearlyCost.toLocaleString(undefined, {maximumFractionDigits:0})}</div>
                                            <div className="text-[10px] text-slate-500 mt-2 font-mono">Fixed Estimate x12</div>
                                        </div>
                                    </div>

                                    {/* Breakdown Receipt (Cyber style) */}
                                    {billMode === 'progressive' && totalMonthlyUnits > 0 && (
                                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row justify-between items-center gap-4 relative overflow-hidden">
                                            <div className="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-indigo-500 to-purple-500"></div>
                                            <div className="flex items-center gap-4 pl-2">
                                                <i data-feather="file-text" className="w-5 h-5 text-indigo-400"></i>
                                                <div className="font-mono text-xs text-slate-400 space-y-1">
                                                    <div><span className="text-slate-500">BASE:</span> {monthlyBillData.energyCharge.toFixed(2)}</div>
                                                    <div><span className="text-slate-500">SERV:</span> {monthlyBillData.serviceCharge.toFixed(2)} | <span className="text-slate-500">FT:</span> {monthlyBillData.ftCharge.toFixed(2)}</div>
                                                </div>
                                            </div>
                                            <div className="text-right border-l border-slate-800 pl-4">
                                                <div className="text-[10px] font-bold text-slate-500 uppercase">+ VAT 7% ({monthlyBillData.vat.toFixed(2)})</div>
                                                <div className="text-lg font-black text-white tracking-widest">TOTAL ฿{monthlyBillData.grandTotal.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Table */}
                                    <div className="cyber-panel overflow-hidden flex-grow">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                                <thead className="bg-slate-900/80 border-b border-slate-800">
                                                    <tr>
                                                        <th className="px-6 py-4 font-bold text-slate-500 uppercase tracking-widest text-[10px]">Appliance</th>
                                                        <th className="px-6 py-4 font-bold text-slate-500 uppercase tracking-widest text-[10px] text-center">Power</th>
                                                        <th className="px-6 py-4 font-bold text-slate-500 uppercase tracking-widest text-[10px] text-center">Time</th>
                                                        <th className="px-6 py-4 font-bold text-slate-500 uppercase tracking-widest text-[10px] text-center">Load (kWh)</th>
                                                        <th className="px-6 py-4 font-bold text-slate-500 uppercase tracking-widest text-[10px] text-center">CMD</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-800/50">
                                                    {appliances.map((item) => {
                                                        const monthlyUnits = ((item.watts / 1000) * item.hours * item.quantity) * 30;
                                                        return (
                                                            <tr key={item.id} className="hover:bg-slate-800/30 transition-colors group">
                                                                <td className="px-6 py-4">
                                                                    <div className="font-bold text-slate-200">{item.name}</div>
                                                                    {item.quantity > 1 && <span className="text-[10px] font-black text-slate-900 bg-slate-400 px-2 py-0.5 rounded mt-1 inline-block">x{item.quantity}</span>}
                                                                </td>
                                                                <td className="px-6 py-4 text-center font-mono text-orange-400">{item.watts}W</td>
                                                                <td className="px-6 py-4 text-center font-mono text-blue-400">{item.hours}h</td>
                                                                <td className="px-6 py-4 text-center font-black text-white bg-slate-900/50">{monthlyUnits.toFixed(1)}</td>
                                                                <td className="px-6 py-4 text-center">
                                                                    <button onClick={() => removeAppliance(item.id)} className="p-2 text-slate-600 hover:text-red-500 transition-colors">
                                                                        <i data-feather="x-circle" className="w-4 h-4"></i>
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                    {appliances.length === 0 && (
                                                        <tr><td colSpan="5" className="px-6 py-12 text-center font-mono text-slate-600">No active devices found.</td></tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ElectricalDashboard />);
    </script>
</body>
</html>
